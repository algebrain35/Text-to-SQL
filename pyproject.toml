[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemagraph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    "networkx>=3.2",
    "sqlglot>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]  # httpx: FastAPI's TestClient
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
eval = ["pandas>=2"]  # only for run_eval.summarize(); the command-line summary does not need it

[tool.setuptools.packages.find]
include = ["schemagraph*"]

# The catalog queries are data files inside the package.
[tool.setuptools.package-data]
"schemagraph.extraction" = ["sql/*.sql"]
